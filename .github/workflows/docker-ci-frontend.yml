name: CI/CD - Frontend → Docker Hub + Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    environment: csoapp-front
    outputs:
      sha_tag: ${{ steps.meta.outputs.SHA_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        env:
          DU: ${{ secrets.DOCKERHUB_USERNAME }}
          DT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DU" ] || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          [ -n "$DT" ] || (echo "Missing DOCKERHUB_TOKEN" && exit 1)

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push (frontend - Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            azizhasnaoui/csoapp-front:latest
            azizhasnaoui/csoapp-front:${{ steps.meta.outputs.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push-frontend
    environment: csoapp-front
    steps:
      - name: Validate deploy secrets
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY:  ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$HOST" ] || (echo "Missing SSH_HOST" && exit 1)
          [ -n "$USER" ] || (echo "Missing SSH_USER" && exit 1)
          [ -n "$KEY"  ] || (echo "Missing SSH_KEY" && exit 1)

      - name: Write SSH key (preserve newlines)
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.SSH_KEY }}" | sed 's/\r$//' > ssh_key
          chmod 600 ssh_key

      - name: Deploy (pull new image & restart web)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          APP_DIR:  ${{ vars.APP_DIR || '/opt/csoapp' }}
          TAG:      ${{ needs.build-and-push-frontend.outputs.sha_tag }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -i ssh_key -p $SSH_PORT $SSH_USER@$SSH_HOST"
          $SSH "cd $APP_DIR && FRONTEND_TAG=$TAG docker compose -f docker-compose.prod.yml pull web"
          $SSH "cd $APP_DIR && FRONTEND_TAG=$TAG docker compose -f docker-compose.prod.yml up -d web"
          # Optional quick probe: fetch first asset referenced by index.html
          $SSH 'ASSET=$(curl -s http://127.0.0.1/ | grep -Eo "/assets/[^\" ]+\\.js" | head -1); [ -n "$ASSET" ] && curl -sI "http://127.0.0.1$ASSET" | head -n1 || true'
