# .github/workflows/docker-ci-frontend.yml
name: CI - Frontend → Docker Hub (Caddy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest
    environment: csoapp-front   # <<— IMPORTANT: matches your env name exactly
    steps:
      - uses: actions/checkout@v4

      # Optional sanity check so failures are obvious
      - name: Validate secrets
        env:
          DU: ${{ secrets.DOCKERHUB_USERNAME }}
          DT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DU" ] || (echo "Missing DOCKERHUB_USERNAME" && exit 1)
          [ -n "$DT" ] || (echo "Missing DOCKERHUB_TOKEN" && exit 1)

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push (frontend - Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            azizhasnaoui/csoapp-front:latest
            azizhasnaoui/csoapp-front:${{ steps.meta.outputs.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
